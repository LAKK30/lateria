<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08070a"/>
      <stop offset=".35" stop-color="#140f14"/>
      <stop offset=".58" stop-color="#2b141b"/>
      <stop offset=".72" stop-color="#4a1d27"/>
      <stop offset=".86" stop-color="#26141a"/>
      <stop offset="1" stop-color="#0d0b0e"/>
    </linearGradient>
    <radialGradient id="halo" cx="1390" cy="330" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c2504f" stop-opacity=".42"/>
      <stop offset=".22" stop-color="#8f2f3c" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#57232F" stop-opacity=".08"/>
      <stop offset="1" stop-color="#57232F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx=".38" cy=".34" r=".75">
      <stop offset="0" stop-color="#f0cbb4"/>
      <stop offset=".45" stop-color="#d48a74"/>
      <stop offset=".8" stop-color="#a5464a"/>
      <stop offset="1" stop-color="#6e2430"/>
    </radialGradient>
    <radialGradient id="moonShade" cx=".75" cy=".7" r=".7">
      <stop offset="0" stop-color="#3a0f18" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3a0f18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farMt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c1f29"/>
      <stop offset="1" stop-color="#1f1419"/>
    </linearGradient>
    <linearGradient id="midMt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241519"/>
      <stop offset="1" stop-color="#120d11"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1216"/>
      <stop offset=".5" stop-color="#0e0a0d"/>
      <stop offset="1" stop-color="#070608"/>
    </linearGradient>
    <linearGradient id="fogG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2c3a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6b2834" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1a1014" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".6" cy=".45" r=".85">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".75"/>
    </radialGradient>
    <pattern id="crenel" width="18" height="12" patternUnits="userSpaceOnUse">
      <rect width="10" height="12" fill="#0d0a0e"/>
    </pattern>
    <filter id="blur40" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur18" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .8  0 0 0 0 .7  0 0 0 0 .65  0 0 0 .07 0"/>
    </filter>
    <filter id="moonTex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="4" seed="7"/>
      <feColorMatrix values="0 0 0 0 .25  0 0 0 0 .05  0 0 0 0 .08  0 0 0 1.1 -.45"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="castleG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a080b"/><stop offset=".7" stop-color="#110c10"/><stop offset="1" stop-color="#1e1217"/></linearGradient>
    <linearGradient id="baseGlow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9b3a45" stop-opacity="0"/><stop offset="1" stop-color="#9b3a45" stop-opacity=".28"/></linearGradient>
    <clipPath id="moonClip"><circle cx="1390" cy="330" r="150"/></clipPath>
  </defs>

