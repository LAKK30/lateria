  <path d="M1392 128 h36" stroke="#e0b49a" stroke-opacity=".35" stroke-width="2"/>

  <!-- ближний туман -->
  <g filter="url(#blur40)">
    <ellipse cx="1200" cy="800" rx="520" ry="60" fill="#5d2430" opacity=".55"/>
    <ellipse cx="520" cy="860" rx="600" ry="70" fill="#3c1a22" opacity=".6"/>
    <ellipse cx="1650" cy="880" rx="420" ry="60" fill="#4a1d27" opacity=".5"/>
