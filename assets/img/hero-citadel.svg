    <circle cx="140" cy="90" r="1.3" opacity=".5"/><circle cx="310" cy="170" r="1" opacity=".35"/><circle cx="480" cy="70" r="1.2" opacity=".45"/>
    <circle cx="660" cy="210" r=".9" opacity=".3"/><circle cx="820" cy="110" r="1.3" opacity=".45"/><circle cx="980" cy="50" r="1" opacity=".4"/>
    <circle cx="1100" cy="180" r=".9" opacity=".3"/><circle cx="1680" cy="90" r="1.2" opacity=".45"/><circle cx="1800" cy="210" r="1" opacity=".35"/>
    <circle cx="1860" cy="60" r="1.1" opacity=".4"/><circle cx="400" cy="290" r=".8" opacity=".25"/><circle cx="1580" cy="40" r=".8" opacity=".3"/>
    <circle cx="70" cy="330" r=".9" opacity=".2"/><circle cx="900" cy="300" r=".7" opacity=".2"/><circle cx="1240" cy="80" r=".9" opacity=".35"/>
